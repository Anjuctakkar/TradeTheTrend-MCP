# Dashboard + Postgres + Caddy (automatic HTTPS). Only Caddy is reachable from the internet.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-nse}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DASHBOARD_PUBLIC: "1"            # refuse to start without Google sign-in configured
      DASHBOARD_COOKIE_SECURE: "1"
      DASHBOARD_DATA_DIR: /data
      DATABASE_URL: postgresql://${POSTGRES_USER:-nse}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nse}
    volumes:
      - ./data:/data                   # settings written from the dashboard (.env edits) and legacy files to import
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"                         # not published to the internet

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data               # the HTTPS certificates
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
