# Render Blueprint: the dashboard as one web service plus a managed Postgres database.
# Deploy: push this project to a PRIVATE Git repo, then in Render choose New > Blueprint.
# Check it first (optional): render blueprints validate render.yaml
# Plan names change over time: check Render's pricing page and edit the two `plan:` lines if needed.
databases:
  - name: nse-db
    plan: basic-256mb
    region: singapore                  # must match the web service so the private connection works
    postgresMajorVersion: "16"

services:
  - type: web
    name: nse-dashboard
    runtime: python
    plan: starter
    region: singapore                  # the closest Render region to India
    buildCommand: pip install -r requirements.lock.txt
    startCommand: python -m uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DASHBOARD_PUBLIC
        value: "1"                     # refuse to start without Google sign-in configured
      - key: DASHBOARD_COOKIE_SECURE
        value: "1"
      - key: DASHBOARD_CLIENT_IP_HEADER
        value: cf-connecting-ip        # Render sits behind Cloudflare; this is the visitor's real address
      - key: DASHBOARD_SECRET
        generateValue: true            # Render makes and keeps a random secret
      - key: DATABASE_URL
        fromDatabase:
          name: nse-db
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false                    # Render asks for this on the first deploy
      - key: ADMIN_EMAILS
        sync: false
      - key: ALLOWED_EMAILS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AGENT_MODEL
        value: claude-sonnet-5-5
      - key: AGENT_USER_RATE_PER_10MIN
        value: "15"
      - key: AGENT_USER_DAILY_CAP
        value: "100"
      - key: AGENT_DAILY_CAP
        value: "500"
